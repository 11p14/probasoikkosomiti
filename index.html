<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>প্রবাস ঐক্য সমিতি</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14532d">
<link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap">

<div id="upd" hidden>নতুন ভার্সন পাওয়া গেছে। <button id="updb">আপডেট করুন</button></div><div id="toast"></div>
<section id="login"><form id="lf" class="card"><h1>প্রবাস ঐক্য সমিতি</h1><p>ঐক্যে সঞ্চয়, বিশ্বাসে সমৃদ্ধি।</p>

<label>পাসওয়ার্ড<input name="p" type="password" required autocomplete="current-password"></label><button class="btn">লগইন</button>
<button type="button" id="inst" class="btn alt" hidden>অ্যাপ ইনস্টল করুন</button></form></section>
<div id="app" hidden><header><button id="mb">☰</button><b>প্রবাস ঐক্য</b></header><nav id="nav"></nav><main id="main"></main></div>
<div id="modal" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="script.js"></script></body></html>
